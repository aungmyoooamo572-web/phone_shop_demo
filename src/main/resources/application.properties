spring.application.name=phone_shop_demo

# ---------------------------------------------------------------------------
# Credentials do NOT live in this tracked file.
#
# The database username, the database password and the JWT signing secret are
# read from the environment, or from the untracked application-local.properties
# that sits OUTSIDE the packaged JAR, next to pom.xml (see .gitignore).
# Keeping it out of src/main/resources is what stops `mvn package` from baking
# local credentials into the artifact.
#
# Environment variables (relaxed binding, so these map onto the properties used
# by the application):
#
#   SPRING_DATASOURCE_USERNAME    -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD    -> spring.datasource.password
#   PHONE_SHOP_JWT_SECRET         -> phone-shop.jwt.secret
#   PHONE_SHOP_JWT_EXPIRATION_MS  -> phone-shop.jwt.expiration-ms
#
# An environment variable always wins over application-local.properties, so a
# deployment only has to set the variables above and never ships the file.
#
# The path below is resolved against the working directory, so start the
# application from the backend project root (the folder that holds pom.xml):
#
#   cd phone_shop_demo
#   .\mvnw.cmd spring-boot:run
#
# `optional:` means a missing file is not an error, which is what lets a
# deployment run on environment variables alone.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/phone_shop_demo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true
